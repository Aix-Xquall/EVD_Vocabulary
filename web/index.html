<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EVD Daily Vocabulary</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar">
        <p class="eyebrow">Aerospace / Avionics / EMC</p>
      </section>

      <label class="chapter-picker" for="chapterSelect">
        <span>英文章節</span>
        <select id="chapterSelect" aria-label="英文章節"></select>
      </label>

      <details class="statistics-panel">
        <summary>
          <span>練習統計<span id="statisticsSummary" class="statistics-summary">(尚無練習紀錄)</span></span>
        </summary>
        <div class="statistics-content">
          <div class="statistics-toolbar">
            <div class="statistics-modes" role="group" aria-label="統計排序方式">
              <button id="frequentStatsButton" class="active" type="button" aria-pressed="true">常練習</button>
              <button id="forgottenStatsButton" type="button" aria-pressed="false">容易忘記</button>
            </div>
            <button id="syncStatsButton" type="button">同步統計</button>
          </div>
          <p id="statisticsSyncStatus" class="sync-status">統計會自動同步</p>
          <div id="statisticsList" class="statistics-list"></div>
        </div>
      </details>

      <details class="settings-panel">
        <summary>
          <span>設定<span id="settingsSummary" class="settings-summary">(1.0x · 重複 5 次 · 正向播放)</span></span>
        </summary>
        <div class="settings-content">
          <div class="settings-controls">
            <label><input id="repeatAllToggle" type="checkbox" checked> 循環本章節</label>
            <label><input id="repeatCurrentToggle" type="checkbox"> 重複目前單字</label>
            <label><input id="includeExamplesToggle" type="checkbox" checked> 播放例句</label>
            <div class="playback-direction-control" role="group" aria-labelledby="playbackDirectionLabel">
              <span id="playbackDirectionLabel">今日單字順序</span>
              <div class="segmented-control">
                <label>
                  <input type="radio" name="playbackDirection" value="forward" checked>
                  <span>正向播放</span>
                </label>
                <label>
                  <input type="radio" name="playbackDirection" value="reverse">
                  <span>反向播放</span>
                </label>
              </div>
            </div>
            <label class="rate-control" for="playbackRate">
              英文語速 <output id="playbackRateValue">1.0x</output>
              <input id="playbackRate" type="range" min="0.5" max="1.5" step="0.1" value="1.0">
            </label>
            <label class="rate-control" for="exampleRepeatCount">
              英文重複 <output id="exampleRepeatCountValue">5</output>
              <input id="exampleRepeatCount" type="range" min="1" max="5" step="1" value="5">
            </label>
            <button id="combinedAudioButton" type="button">播放本章節</button>
          </div>
          <div class="settings-sync">
            <span id="settingsSyncStatus" class="sync-status">設定會自動同步</span>
            <button id="syncSettingsButton" type="button">同步設定</button>
          </div>
        </div>
      </details>

      <section class="player-layout">
        <aside class="word-list" aria-label="Daily words">
          <div class="list-header">
            <h2>今日單字</h2>
            <button id="toggleMeaningButton" type="button">隱藏中文</button>
          </div>
          <div id="wordList" class="word-items"></div>
        </aside>

        <section class="study-panel">
          <div class="current-word">
            <div class="current-word-meta">
              <p id="categoryText" class="eyebrow">Category</p>
              <p id="currentWordStats" class="current-word-stats">練習 0 次 · 重複 0 次</p>
            </div>
            <h2 id="wordText">Loading</h2>
            <p id="pronunciationText" class="pronunciation"></p>
            <p id="meaningText" class="meaning"></p>
            <div class="hard-word-actions">
              <button id="hardWordButton" type="button">加入未熟記單字</button>
              <span id="hardWordHelp" class="help-tip" hidden>
                <button
                  class="help-button"
                  type="button"
                  aria-label="未熟記單字提示"
                  aria-describedby="hardWordHelpText"
                  title="已熟記，取消勾選後可加入未熟記練習"
                >?</button>
                <span id="hardWordHelpText" class="help-tooltip" role="tooltip">已熟記，取消勾選後可加入未熟記練習</span>
              </span>
              <span id="hardWordStatus" class="sync-status hard-word-status" hidden></span>
              <label class="mastered-control">
                <input id="masteredWordToggle" type="checkbox">
                已熟記
              </label>
              <span id="masteredWordStatus" class="sync-status"></span>
            </div>
          </div>

          <div class="controls" aria-label="Playback controls">
            <button id="previousButton" type="button">上一個</button>
            <button id="playButton" class="playback-button" type="button" aria-pressed="false">播放</button>
            <button id="nextButton" type="button">下一個</button>
          </div>

          <div class="examples">
            <h3>Examples</h3>
            <p id="exampleOneEn"></p>
            <p id="exampleOneZh" class="translation"></p>
            <p id="exampleTwoEn"></p>
            <p id="exampleTwoZh" class="translation"></p>
          </div>
        </section>
      </section>

      <section class="practice-panel">
        <div class="practice-header">
          <h2>每日練習<span id="practiceScore" class="practice-score">(正確率0/0)</span></h2>
        </div>
        <div class="practice-card">
          <p id="questionMode" class="eyebrow">Practice</p>
          <h3 id="questionText">Loading</h3>
          <p id="questionHint" class="question-hint"></p>
          <div class="cloze-answer">
            <input
              id="clozeAnswerInput"
              type="text"
              aria-label="填入英文單字或片語"
              autocomplete="off"
              spellcheck="false"
            >
            <button id="submitAnswerButton" type="button">送出答案</button>
          </div>
          <p id="answerFeedback" class="feedback"></p>
          <button id="nextQuestionButton" type="button">下一題</button>
        </div>
      </section>
    </main>

    <audio id="audioPlayer" preload="metadata"></audio>
    <script src="learning_helpers.js"></script>
    <script src="app.js"></script>
  </body>
</html>
